<!-- ID: templates/user/user_base.html -->
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Panel | TMA</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="baseuser-wrapper">

        <aside class="baseuser-sidebar" id="baseuserSidebar">

            <div style="height: 70px; display: flex; align-items: center; justify-content: center;">
                <span style="color: white; font-size: 1.25rem; font-weight: 800;">TMA</span>
            </div>

            <ul style="list-style: none; padding: 20px 4px; margin: 0;">

                <li style="margin: 20px 2px;">

                    <a href="/user/dashboard"
                       style="display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; font-size: 0.8rem; font-weight: 600; text-align: center; transition: 0.3s; background: {% if request.path == '/user/dashboard' %}#ffffff; color: #000000;{% else %}transparent; color: rgba(255, 255, 255, 0.7);{% endif %};">

                        <span>Dashboard</span>

                    </a>

                </li>

                <li style="margin: 20px 2px;">

                    <a href="/user/browse_treks"
                       style="display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; font-size: 0.8rem; font-weight: 600; text-align: center; transition: 0.3s; background: {% if request.path == '/user/browse_treks' %}#ffffff; color: #000000;{% else %}transparent; color: rgba(255, 255, 255, 0.7);{% endif %};">

                        <span>Browse Treks</span>

                    </a>

                </li>

                <li style="margin: 20px 2px;">

                    <a href="/user/my_bookings"
                       style="display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; font-size: 0.8rem; font-weight: 600; text-align: center; transition: 0.3s; background: {% if request.path == '/user/my_bookings' %}#ffffff; color: #000000;{% else %}transparent; color: rgba(255, 255, 255, 0.7);{% endif %};">

                        <span>My Bookings</span>

                    </a>

                </li>

                <li style="margin: 20px 2px;">

                    <a href="/user/trek_history"
                       style="display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; font-size: 0.8rem; font-weight: 600; text-align: center; transition: 0.3s; background: {% if request.path == '/user/trek_history' %}#ffffff; color: #000000;{% else %}transparent; color: rgba(255, 255, 255, 0.7);{% endif %};">

                        <span>Trek History</span>

                    </a>

                </li>

                <li style="margin: 20px 2px;">

                    <a href="/user/profile"
                       style="display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; font-size: 0.8rem; font-weight: 600; text-align: center; transition: 0.3s; background: {% if request.path == '/user/profile' %}#ffffff; color: #000000;{% else %}transparent; color: rgba(255, 255, 255, 0.7);{% endif %};">

                        <span>Profile</span>

                    </a>

                </li>

                <li style="margin: 20px 2px;">

                    <a href="/logout"
                       style="display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; font-size: 0.8rem; font-weight: 600; text-align: center; transition: 0.3s; background: transparent; color: rgba(255, 255, 255, 0.7);">

                        <span>Logout</span>

                    </a>

                </li>

            </ul>

        </aside>


        <div class="baseuser-main">

            <header class="baseuser-topbar">

                <div class="baseuser-title">
                
                    User Panel
                
                </div>

                {% if current_user %}
                <div class="d-flex align-items-center text-secondary font-weight-bold" style="font-size: 0.95rem;">
                    <span>{{ current_user.name }}</span>
                </div>
                {% endif %}

            </header>

            <main class="baseuser-content">

                {% block content %}
                {% endblock %}

            </main>

        </div>

    </div>

    <script>
        setTimeout(() => {
            document.querySelectorAll('.alert').forEach(el => {
                el.style.transition = 'opacity 0.5s';
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 500);
            });
        }, 5000);
    </script>
</body>
</html>
