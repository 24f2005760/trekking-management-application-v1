<!-- ID: templates/admin/admin_dashboard.html -->
{% extends "admin/admin_base.html" %}

{% block content %}

<h1 class="admindash-title">
    Dashboard
</h1>

<div class="row g-4 mb-4">

    <div class="col-md-4">

        <div class="admindash-card card-treks">

            <h2>{{ total_treks }}</h2>

            <p>Total Treks</p>

        </div>

    </div>

    <div class="col-md-4">

        <div class="admindash-card card-users">

            <h2>{{ total_users }}</h2>

            <p>Total Users</p>

        </div>

    </div>

    <div class="col-md-4">

        <div class="admindash-card card-staff">

            <h2>{{ total_staff }}</h2>

            <p>Total Staff</p>

        </div>

    </div>

</div>

<div class="row g-4 mb-4">

    <div class="col-md-6">

        <div class="admindash-card card-bookings">

            <h2>{{ total_bookings }}</h2>

            <p>Total Bookings</p>

        </div>

    </div>

    <div class="col-md-6">

        <div class="admindash-card card-pending">

            <h2>{{ pending_staff }}</h2>

            <p>Pending Staff Approvals</p>

        </div>

    </div>

</div>


{% endblock %}
